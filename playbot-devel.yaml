services:
  playbot-devel:
    build: 
      context: .
      dockerfile: Dockerfile-playbot
    container_name: playbot
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - youtube_cookies
    volumes:
      - playbot-data:/discord-playbot/playlists
    networks:
      - botnet

secrets:
  youtube_cookies:
    file: ./secret/cookies.txt

networks:
  botnet:
    driver: bridge

volumes:
  playbot-data: